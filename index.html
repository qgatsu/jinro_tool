<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>人狼パワーツール</title>
        <link rel="stylesheet" href="styles.css?v=20261103-3">
        <link rel="icon" href="images/okami_halloween_gray.png" type="image/png">
    </head>
<body>
    <div class="app">
        <header class="app-toolbar">
            <div class="toolbar-start">
                <img
                    src="images/hatena.png"
                    alt="つかいかた"
                    id="openHelpModalBtn"
                    class="toolbar-icon help-icon"
                    role="button"
                    tabindex="0"
                    aria-pressed="false"
                >
            </div>
            <div class="brand-logo">
                <span class="brand-text">人狼パワーツール</span>
                <img src="images/okami_halloween_gray.png" alt="" class="brand-icon brand-icon-light" aria-hidden="true">
                <img src="images/moon_yellow.png" alt="" class="brand-icon brand-icon-dark" aria-hidden="true">
            </div>
            <div class="toolbar-actions">
                <button type="button" id="openExportModalBtn" class="export-btn" aria-haspopup="dialog" aria-controls="exportModal">
                    <svg class="export-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"></path>
                    </svg>
                    <span>エクスポート</span>
                </button>
                <button type="button" id="themeToggle" class="theme-toggle" aria-pressed="false" aria-label="ダークモードに切り替え">
                    <span class="visually-hidden">テーマ切り替え</span>
                    <img src="images/moon_icon_2.png" alt="" class="theme-icon theme-icon-dark" width="28" height="28" loading="lazy" decoding="async">
                    <img src="images/taiyo_icon.png" alt="" class="theme-icon theme-icon-light" width="32" height="32" loading="lazy" decoding="async">
                </button>
            </div>
        </header>
        <section class="match-toolbar" aria-label="試合管理">
            <label for="matchSelect">試合</label>
            <select id="matchSelect" aria-label="表示する試合"></select>
            <button type="button" id="newMatchBtn">記録して次の試合へ</button>
            <button type="button" id="resetMatchBtn">リセット</button>
            <span id="saveStatus" role="status" aria-live="polite"></span>
            <button type="button" id="reloadMatchesBtn" hidden>再読み込み</button>
        </section>
        <main class="main-layout">
            <section class="panel players-panel">
                <div class="panel-header">
                    <h2>プレイヤー</h2>
                    <span class="count">0 人</span>
                </div>
                <form id="playerForm" class="player-form">
                    <ul class="players-list" id="playersList">
                        <li class="player-card empty">未登録です。下のフォームから追加してください。</li>
                    </ul>
                    <div class="input-row">
                        <input type="text" name="name" placeholder="名前を入力" required>
                    </div>
                    <div class="player-actions">
                        <button type="button" id="openBulkModalBtn">テキストから登録</button>
                        <button type="submit">登録</button>
                    </div>
                </form>
            </section>
            <section class="panel co-panel">
                <div class="co-table-wrapper">
                    <table class="co-table" id="coTable"></table>
                </div>
                <div class="role-add-zone">
                    <button type="button" id="addRoleBtn" class="role-add-plus" aria-label="役職を追加" title="役職を追加">+</button>
                </div>
                <div class="co-tabs" role="tablist">
                    <button type="button" class="co-tab active" data-co-tab="voting" role="tab" aria-selected="true">投票管理</button>
                    <button type="button" class="co-tab" data-co-tab="scale" role="tab" aria-selected="false">スケール</button>
                </div>
                <div class="co-tab-panel" data-co-tab="voting" role="tabpanel">
                    <div class="voting-panel">
                        <div class="voting-layout-wrap">
                            <div class="voting-tabs" id="votingTabs"></div>
                            <div class="voting-content-wrap">
                                <div class="voting-controls">
                                    <button type="button" id="deleteVoteBtn" disabled>選択した1票を削除</button>
                                    <button type="button" id="undoVoteBtn" disabled>1つ戻る</button>
                                    <button type="button" id="redoVoteBtn" disabled>1つ進む</button>
                                </div>
                                <div class="voting-tab-content" id="votingContent"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="co-tab-panel" data-co-tab="scale" role="tabpanel" hidden>
                    <div class="scale-layout-wrap">
                        <div class="scale-day-tabs" id="scaleDayTabs"></div>
                        <div class="scale-list" id="scaleList">
                            <p class="scale-empty">プレイヤーが登録されていません。</p>
                        </div>
                    </div>
                </div>
            </section>
            <section class="panel memo-panel">
                <div class="panel-header">
                    <h2>メモ</h2>
                </div>
                <textarea class="memo-textarea" placeholder="メモを入力してください..."></textarea>
            </section>
        </main>
    </div>
    <div class="modal-overlay" id="helpModal" aria-hidden="true">
        <div class="modal help-modal">
            <p class="help-intro">読み込み中です...</p>
        </div>
    </div>
    <div class="modal-overlay" id="bulkModal" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bulkTitle">
            <div class="modal-header">
                <h3 id="bulkTitle">テキストから登録</h3>
                <button type="button" class="modal-close" id="bulkModalClose" aria-label="閉じる">×</button>
            </div>
            <p class="modal-description">カンマや改行区切りで複数の名前を貼り付けてください。</p>
            <textarea id="bulkPlayersInput" class="bulk-textarea" rows="6" placeholder="太郎, 花子&#10;田中"></textarea>
            <div class="modal-actions">
                <button type="button" id="bulkCancelBtn">キャンセル</button>
                <button type="button" id="bulkSubmitBtn" class="primary">登録する</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="exportModal" aria-hidden="true">
        <div class="modal export-modal" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
            <div class="modal-header">
                <h3 id="exportTitle">試合まとめをエクスポート</h3>
                <button type="button" class="modal-close" id="exportModalClose" aria-label="閉じる">×</button>
            </div>
            <fieldset class="export-fields">
                <legend>共通設定</legend>
                <label class="modal-field-label" for="exportFolderInput">村名（フォルダ名）</label>
                <input id="exportFolderInput" class="modal-textarea" type="text" maxlength="100" placeholder="例：月夜の村">
                <label class="modal-field-label" for="exportGMInput">GM名（任意）</label>
                <input id="exportGMInput" class="modal-textarea" type="text" maxlength="120">
                <label class="modal-field-label" for="exportScopeInput">出力形式</label>
                <select id="exportScopeInput" class="modal-textarea">
                    <option value="all">全試合（ZIP）</option>
                    <option value="single">選択した試合（PDF）</option>
                </select>
                <label class="modal-field-label" for="exportFilenamePreview">出力ファイル</label>
                <output id="exportFilenamePreview" class="export-file-preview"></output>
            </fieldset>
            <fieldset class="export-fields">
                <legend>試合ごとの結果・配役</legend>
                <label class="modal-field-label" for="exportMatchSelect">編集する試合</label>
                <select id="exportMatchSelect" class="modal-textarea"></select>
                <label class="modal-field-label" for="exportResultInput">試合結果</label>
                <textarea id="exportResultInput" class="modal-textarea" rows="2" placeholder="例：村人勝ち / 狼負け"></textarea>
                <label class="modal-field-label" for="exportRolesInput">正解の配役</label>
                <textarea id="exportRolesInput" class="modal-textarea" rows="3" placeholder="例: 狼: 太郎, 花子&#10;占い: 山田"></textarea>
            </fieldset>
            <p id="exportStatus" class="export-note" role="status" aria-live="polite"></p>
            <div class="modal-actions">
                <button type="button" id="exportCancelBtn">閉じる</button>
                <button type="button" id="exportSubmitBtn" class="primary">ZIPをダウンロード</button>
            </div>
        </div>
    </div>
    <script type="module" src="main.js?v=20261103-3"></script>
</body>
</html>
